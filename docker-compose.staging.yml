version: "3.8"

services:
  # PostgreSQL Database (Staging)
  postgres:
    image: postgres:15-alpine
    container_name: mockhu-postgres-staging
    environment:
      POSTGRES_USER: mockhu
      POSTGRES_PASSWORD: mockhu_staging_password_2024
      POSTGRES_DB: mockhu_staging_db
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockhu -d mockhu_staging_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mockhu-staging-network

  # Mockhu Backend API (Staging)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mockhu-backend-staging
    environment:
      DATABASE_URL: postgresql://mockhu:mockhu_staging_password_2024@postgres:5432/mockhu_staging_db
      JWT_SECRET: staging_jwt_secret_change_this_2024
      PORT: 8085
      ENV: staging
    ports:
      - "8085:8085"
    volumes:
      - ./storage:/root/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mockhu-staging-network

  # Nginx Reverse Proxy (Staging)
  nginx:
    image: nginx:alpine
    container_name: mockhu-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage:/usr/share/nginx/html/storage:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mockhu-staging-network

volumes:
  postgres-staging-data:

networks:
  mockhu-staging-network:
    driver: bridge
